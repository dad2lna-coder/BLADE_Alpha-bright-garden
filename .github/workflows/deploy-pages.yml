name: Deploy bright-garden Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh preview from source branch a few times a day
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BLADE_Alpha bright-garden
        uses: actions/checkout@v4
        with:
          repository: dad2lna-coder/BLADE_Alpha
          ref: bright-garden
          path: src

      - name: Build static preview
        run: |
          mkdir -p site
          cd src
          # Copy the offline web app only (skip Tauri / workflows / scripts)
          cp -a index.html site_tmp 2>/dev/null || true
          mkdir -p ../site
          cp -a index.html ../site/
          for d in css js lib modules airport; do
            if [ -d "$d" ]; then cp -a "$d" ../site/; fi
          done
          for f in README.md INSTRUCTIONS.md TEAM-SETUP.md package.json; do
            if [ -f "$f" ]; then cp -a "$f" ../site/; fi
          done
          # Marker so testers know this is the branch preview
          printf '%s\n' 'bright-garden' > ../site/PREVIEW_BRANCH.txt
          # GitHub Pages should not run Jekyll on this static app
          touch ../site/.nojekyll
          ls -la ../site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
