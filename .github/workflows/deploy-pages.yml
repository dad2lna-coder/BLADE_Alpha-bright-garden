name: Deploy bright-garden Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [bright-garden-push]
  schedule:
    # Fallback if no token is set on BLADE_Alpha
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BLADE_Alpha bright-garden
        uses: actions/checkout@v4
        with:
          repository: dad2lna-coder/BLADE_Alpha
          ref: bright-garden
          path: src

      - name: Build static preview
        run: |
          set -euo pipefail
          mkdir -p site
          cd src
          cp -a index.html ../site/
          for d in css js lib modules airport; do
            if [ -d "$d" ]; then cp -a "$d" ../site/; fi
          done
          printf '%s\n' 'bright-garden' > ../site/PREVIEW_BRANCH.txt
          touch ../site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Configure Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
