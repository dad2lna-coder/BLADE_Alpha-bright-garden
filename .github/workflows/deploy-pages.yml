name: Deploy bright-garden Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bright-garden-push]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this Pages repo
        uses: actions/checkout@v4
        with:
          path: dest

      - name: Checkout BLADE_Alpha bright-garden
        uses: actions/checkout@v4
        with:
          repository: dad2lna-coder/BLADE_Alpha
          ref: bright-garden
          path: src

      - name: Copy app onto this repo main
        run: |
          set -euo pipefail
          cd dest
          rm -rf css js lib modules airport index.html .nojekyll PREVIEW_BRANCH.txt
          cp -a ../src/index.html .
          for d in css js lib modules airport; do
            if [ -d "../src/$d" ]; then cp -a "../src/$d" .; fi
          done
          touch .nojekyll
          printf '%s\n' 'bright-garden' > PREVIEW_BRANCH.txt

      - name: Commit and push
        working-directory: dest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync from BLADE_Alpha bright-garden"
          git push origin HEAD:main
